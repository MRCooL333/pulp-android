plugins {
    id 'com.android.application'
}

android {
    namespace 'app.pulp.messenger'
    compileSdk 34

    defaultConfig {
        applicationId 'app.pulp.messenger'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '3.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
}
